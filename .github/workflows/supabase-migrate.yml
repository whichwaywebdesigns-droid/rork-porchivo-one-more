name: Supabase DB Migrate

# Automatically applies pending SQL migrations from supabase/migrations/ to the
# remote Supabase database whenever they're merged into main.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — Personal access token (Dashboard → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   — Database password for the project (set at project creation)
#
# The project ref is hardcoded below — update it if the Supabase project changes.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch: # Allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false # Never cancel a mid-flight migration — could leave DB in partial state

env:
  SUPABASE_PROJECT_REF: axmdzrtyznphlfganljb
  SUPABASE_CLI_VERSION: 2.34.3

jobs:
  migrate:
    name: Push migrations to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          npm install -g supabase@${{ env.SUPABASE_CLI_VERSION }}
          supabase --version

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link \
            --project-ref "${{ env.SUPABASE_PROJECT_REF }}" \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: Push pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Pending migrations:"
          supabase db push --dry-run || true
          echo "---"
          echo "Applying migrations..."
          supabase db push

      - name: Verify migration status
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Migration history:"
          supabase db dump --schema public --data-only=false 2>/dev/null | head -50 || true
