name: Refresh docs snapshots

# Keeps the auto-generated blocks across the project's docs (README.md snapshot,
# MAINTENANCE.md screen index) in sync with the actual codebase. Runs on a schedule,
# on pushes that touch the relevant folders, and on manual dispatch.
on:
  schedule:
    # Every Monday at 06:00 UTC. Adjust the cron to change the interval.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "expo/app/**"
      - "expo/components/**"
      - "expo/lib/**"
      - "expo/store/**"
      - "expo/package.json"
      - "web-porchivo-web/src/pages/**"
      - "web-porchivo-web/package.json"
      - "supabase/**.sql"
      - "scripts/refresh-docs.mjs"

permissions:
  contents: write

concurrency:
  group: refresh-docs
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate docs snapshots
        run: node scripts/refresh-docs.mjs

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain README.md MAINTENANCE.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md MAINTENANCE.md
            git commit -m "docs: auto-refresh docs snapshots"
            git push
          else
            echo "No doc changes to commit."
          fi
