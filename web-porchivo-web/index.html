<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porchivo — Package Security & Resident Retention for Communities</title>
    <meta name="description" content="Porchivo is a package security and resident retention app for HOAs, property managers, and community associations. Real-time risk scoring, instant alerts, and a trusted neighbor guardian network — no hardware or IT project required." />

    <meta property="og:title" content="Porchivo — Package Security & Resident Retention for Communities" />
    <meta property="og:description" content="Porchivo is a package security and resident retention app for HOAs, property managers, and community associations. Real-time risk scoring, instant alerts, and a trusted neighbor guardian network — no hardware or IT project required." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://porchivo.com/og-image.png" />

    <meta name="theme-color" content="#3A7BD5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1B3E" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/png" href="/porchivo-icon-liquid-glass-512.png" />
    <link rel="apple-touch-icon" href="/porchivo-icon-liquid-glass-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Prevent FOUC — apply theme class before React hydrates
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
