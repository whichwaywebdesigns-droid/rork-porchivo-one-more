<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porchivo — Package Security &amp; Resident Retention for Communities</title>
    <meta name="description" content="Real-time package risk scoring, instant alerts to residents and Porch Partners, and a neighbor-held delivery network — with no hardware or IT project required." />
    <meta name="keywords" content="package theft prevention, porch pirate protection, HOA package management, apartment package security, property manager delivery tracking, resident retention amenities, package tracking app, stolen package alerts, trusted neighbor package pickup, neighborhood safety app" />

    <!-- Immersive landing typography: Space Grotesk (display) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />

    <meta property="og:title" content="Porchivo — Package Security &amp; Resident Retention for Communities" />
    <meta property="og:description" content="Real-time package risk scoring, instant alerts to residents and Porch Partners, and a neighbor-held delivery network — with no hardware or IT project required." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://porchivo.com/og-image.png" />

    <meta name="theme-color" content="#D4C4A8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A1128" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/png" href="/porchivo-icon-liquid-glass-512.png" />
    <link rel="apple-touch-icon" href="/porchivo-icon-liquid-glass-512.png" />
    <script>
      // Prevent FOUC — apply theme class before React hydrates
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
