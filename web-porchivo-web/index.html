<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porchivo — Package Risk Intelligence for Your Porch</title>
    <meta name="description" content="Porchivo calculates a real-time porch risk score for every incoming package, sends theft alerts when risk rises, and connects homeowners with trusted neighbors who can hold deliveries safely." />

    <meta property="og:title" content="Porchivo — Package Risk Intelligence for Your Porch" />
    <meta property="og:description" content="Porchivo calculates a real-time porch risk score for every incoming package, sends theft alerts when risk rises, and connects homeowners with trusted neighbors who can hold deliveries safely." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://porchivo.com/og-image.png" />

    <meta name="theme-color" content="#3A7BD5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1B3E" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <script>
      // Prevent FOUC — apply theme class before React hydrates
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
